name: Abundant Logic Agent - Windows MSI

# Builds the rebranded Windows MSI on GitHub's Windows runners.
#  - Push to an abundantlogic-* branch or run manually -> test build, MSI attached to the run as an artifact
#  - Push a tag like 1.21-al1                          -> release build, published as a GitHub Release
# Derived from upstream's glpi-agent-packaging.yml (windows-packaging job), without code signing.
# BUILD_DIR must match "C:\Strawberry-perl-for-<PROVIDER>-Agent_build" (PROVIDER in lib/GLPI/Agent/Version.pm).

# Builds only on release tags and manual runs (gh workflow run <file> --ref <branch>), not on every
# branch push: GitHub pauses Actions on forks with heavy usage ("Workflows are not currently being
# run on this fork due to the scale of GitHub Actions usage", 2026-11-26).
on:
  push:
    tags: [ '*-al*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: C:\Strawberry-perl-for-AbundantLogic-Agent_build

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 300
    permissions:
      contents: write   # needed to publish the release on tag builds

    steps:
    - uses: actions/checkout@v6

    - name: Create folders for cached data
      run: |
        mkdir %BUILD_DIR%\download
        mkdir %BUILD_DIR%\restore
      shell: cmd

    - name: Restore points cache
      uses: actions/cache@v5
      id: built-perl-cache
      with:
        path: C:/Strawberry-perl-for-AbundantLogic-Agent_build/restore
        key: al-windows-perl-cache-x64-${{ hashFiles('contrib\windows\glpi-agent-extlibs-build.pl', 'contrib\windows\glpi-agent-packaging.pl', 'contrib\windows\packaging\*') }}

    - name: Restore ca.dll cache
      uses: actions/cache@v5
      id: built-ca-dll-cache
      with:
        path: contrib/windows/packaging/tools/ca/ca.dll
        key: al-windows-ca-dll-cache-x64-${{ hashFiles('contrib\windows\glpi-agent-extlibs-build.pl', 'contrib\windows\packaging\ToolchainBuildJob.pm', 'contrib\windows\packaging\CustomCodeSigning.pm', 'contrib\windows\packaging\CustomActionDllBuildJob.pm', 'contrib\windows\packaging\tools\ca\Makefile', 'contrib\windows\packaging\tools\ca\dll\*') }}

    - name: Restore toolchain cache
      uses: actions/cache@v5
      id: built-extlibs-cache
      if: steps.built-perl-cache.outputs.cache-hit != 'true' || steps.built-ca-dll-cache.outputs.cache-hit != 'true'
      with:
        path: |
          C:/Strawberry-perl-for-AbundantLogic-Agent_build/download/winlibs*.zip
          C:/Strawberry-perl-for-AbundantLogic-Agent_build/download/extlibs.zip
        key: al-windows-extlibs-cache-x64-${{ hashFiles('contrib\windows\glpi-agent-extlibs-build.pl', 'contrib\windows\packaging\ToolchainBuildJob.pm', 'contrib\windows\packaging\CustomCodeSigning.pm', 'contrib\windows\packaging\*.patch') }}

    - name: Restore required perl libraries cache
      uses: actions/cache@v5
      id: perl-site-cache
      with:
        path: |
          C:\Strawberry\perl\site\lib
          C:\Strawberry\perl\site\bin
        key: al-built-perl-site-cache-x64-${{ hashFiles('contrib\windows\glpi-agent-extlibs-build.pl', 'contrib\windows\glpi-agent-packaging.pl', 'contrib\windows\packaging\*') }}

    - name: Update environment
      run: |
        echo 'C:\Strawberry\perl\bin'      >> $GITHUB_PATH
        echo 'C:\Strawberry\perl\site\bin' >> $GITHUB_PATH
        echo 'C:\Strawberry\c\bin'         >> $GITHUB_PATH
      shell: bash

    - name: Show environment
      run: |
        perl --version
      shell: cmd

    - name: Install Module::Install
      if: steps.perl-site-cache.outputs.cache-hit != 'true'
      run: cpan -T Module::Install
      shell: cmd

    - name: Prepare Makefile
      run: perl Makefile.PL
      shell: cmd

    - name: Install patched Perl::Dist::Strawberry (same as upstream build)
      if: steps.perl-site-cache.outputs.cache-hit != 'true'
      run: cpanm --notest --verbose https://github.com/g-bougard/Perl-Dist-Strawberry.git
      shell: cmd

    - name: Build extlibs with Perl toolchain
      if: steps.built-perl-cache.outputs.cache-hit != 'true' && steps.built-extlibs-cache.outputs.cache-hit != 'true'
      run: perl contrib\windows\glpi-agent-extlibs-build.pl --arch x64
      shell: cmd

    - name: Build ca.dll with Perl toolchain
      if: steps.built-ca-dll-cache.outputs.cache-hit != 'true'
      run: perl contrib\windows\glpi-agent-extlibs-build.pl --arch x64 --cadll
      shell: cmd

    - name: Build MSI package
      run: perl contrib\windows\glpi-agent-packaging.pl --arch x64
      shell: cmd

    - name: List generated files
      if: success() || failure()
      run: dir %BUILD_DIR%\output
      shell: cmd

    - name: Upload MSI as run artifact
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: AbundantLogic-Agent-Windows-x64
        path: C:\Strawberry-perl-for-AbundantLogic-Agent_build\output

    - name: Publish GitHub Release (tag builds only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Abundant Logic Agent ${{ github.ref_name }}
        body: |
          Abundant Logic build of GLPI Agent (GPL-2.0). Source: this repository at tag ${{ github.ref_name }}.
          Unsigned: Windows SmartScreen may warn when run by hand; silent deployment via msiexec/GPO/Intune is unaffected.
        files: C:/Strawberry-perl-for-AbundantLogic-Agent_build/output/*.msi
